<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraUI Application</title>
    <!-- WebUI engine script -->
    <script src="webui.js"></script>
    <!-- AuraUI client bridge & CSS system -->
    <link rel="stylesheet" href="aura.css">
    <link rel="stylesheet" href="style.css">
    <script src="aura.js"></script>
</head>
<body>
    <!-- Unified App Header Bar -->
    <header class="aura-topbar">
        <div class="aura-brand">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            <span>AuraUI</span>
        </div>
        <div class="aura-topbar-actions">
            <span class="aura-badge aura-badge-success" style="font-size: 11px;">
                <span class="aura-dot"></span> C++ Active
            </span>
        </div>
    </header>

    <!-- Main Application Shell -->
    <div class="aura-app-shell">
        <main class="aura-main-content">
            <div class="hero-section">
                <h1 class="gradient-text">Welcome to AuraUI</h1>
                <p class="subtitle">A fast, lightweight C++ desktop application with standard HTML5 and modern CSS styling.</p>
            </div>

            <!-- Interactive C++ Calculation Card -->
            <div class="aura-card">
                <div class="aura-card-header">
                    <span class="aura-card-title">Native C++ Computation</span>
                    <span class="aura-badge aura-badge-success">
                        <span class="aura-dot"></span> C++ Bound
                    </span>
                </div>

                <div class="calc-grid">
                    <input type="number" id="num-a" class="aura-input" value="12" placeholder="First Number">
                    <select id="op-select" class="aura-input select-op">
                        <option value="+">+</option>
                        <option value="-">−</option>
                        <option value="*">×</option>
                        <option value="/">÷</option>
                    </select>
                    <input type="number" id="num-b" class="aura-input" value="30" placeholder="Second Number">
                    <button id="btn-calc" class="aura-btn aura-btn-primary">Execute in C++</button>
                </div>

                <div class="result-banner" id="calc-result">
                    Result: <strong>42</strong>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
