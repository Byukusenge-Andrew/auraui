[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auraui"
version = "2.0.0"
description = "AuraUI 2 CLI - Modern C++20 Desktop Application Framework with Web UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Andrew Byukusenge", email = "andrewbyukusenge4@gmail.com" }
]
keywords = ["desktop", "gui", "webview", "cpp", "cpp20", "auraui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Software Development :: User Interfaces"
]

[project.urls]
Homepage = "https://github.com/Byukusenge-Andrew/auraui"
Documentation = "https://byukusenge-andrew.github.io/auraui/"

[project.scripts]
auraui = "auraui.cli.auraui:main"
aura = "auraui.cli.auraui:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["auraui*"]
